<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentGate — 工具组</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="root"></div>
<script src="/static/js/app.js"></script>
<script>
let ME = null, GROUPS = [], TG = null, ID = null, IS_OWNER = false, IS_ADMIN = false, CAN_MANAGE = false;
let FILES = [];

async function init() {
  if (!requireAuth()) return;
  ME = await loadMe();
  if (!ME) return;
  ID = new URLSearchParams(location.search).get("id");
  if (!ID) { location.href = "/dashboard"; return; }
  GROUPS = await loadGroups();
  try { TG = await API("/api/toolgroups/" + encodeURIComponent(ID)); }
  catch (e) {
    document.getElementById("root").innerHTML = shell(ME, GROUPS, {
      activeGroup: ID, title: "工具组",
      body: `<div class="card"><p class="muted" style="margin:0">加载失败：${escapeHtml(e.message)}</p>
             <p style="margin:12px 0 0"><a href="/dashboard">← 返回仪表盘</a></p></div>`,
    });
    return;
  }
  IS_OWNER = TG.is_owner;
  IS_ADMIN = !!(ME && ME.is_admin);
  CAN_MANAGE = IS_OWNER || IS_ADMIN;      // 属主或系统管理员可管理该组
  render();
}

function render() {
  mount(ME, GROUPS, {
    activeGroup: ID,
    title: TG.name,
    actions: `<a class="btn ghost sm" href="/dashboard">返回仪表盘</a>`,
    body: `
    <div class="page-head">
      <h2>${escapeHtml(TG.name)}</h2>
      <p>包目录即 Python 包，<code>__init__.py</code> 中定义注入提示词与工具。</p>
    </div>

    <div class="card">
      <div class="kv">
        <div class="k">工具组 ID</div>
        <div class="mono">${escapeHtml(TG.id)}
          <button class="btn ghost sm" style="margin-left:6px" onclick="copyText('${escapeHtml(TG.id)}')">复制</button>
          <span class="muted" style="font-size:12px">— 分享该 ID 即可邀请成员</span></div>
        <div class="k">我的角色</div>
        <div>${IS_OWNER ? '<span class="badge ok">所有者</span>' : '<span class="badge muted">成员</span>'}</div>
        <div class="k">所有者</div>
        <div class="mono">${escapeHtml(TG.owner_id)}</div>
      </div>
    </div>

    <!-- ============ 工具 ============ -->
    <div class="section">
      <div class="section-head"><h3>已注册工具</h3><span class="spacer"></span>
        <span class="hint">来自 <code>__init__.py</code></span></div>
      <div class="card" id="tools-card"><div id="tools-body"></div></div>
    </div>

    <!-- ============ __init__.py ============ -->
    <div class="section">
      <div class="section-head"><h3>包文件 <code>__init__.py</code></h3></div>
      <div class="card">
        <p class="muted" style="margin:0 0 10px;font-size:12.5px">
          用 <code>prompt("...")</code> 设置注入的提示词，用 <code>@tool</code> 注册工具；
          还可用 <code>database</code>（本组独立 KV 存储，list/dict 支持 <code>database["k"].append(x)</code> 这样的深度修改并自动写回）与 <code>name</code>（当前调用者用户名）。
          上传到本目录的 <code>.py</code> 可用相对导入引用，例如 <code>from . import helpers</code>。
        </p>
        <textarea id="init-content" ${CAN_MANAGE ? "" : "readonly"} spellcheck="false"></textarea>
        <div class="row" style="margin-top:10px">
          ${CAN_MANAGE
            ? `<button class="btn" onclick="saveInit()">保存</button>
               <button class="btn ghost" onclick="reload()">保存并重载</button>`
            : `<span class="muted">只读 — 仅所有者或管理员可编辑</span>`}
        </div>
        <div id="reload-out" style="margin-top:12px"></div>
      </div>
    </div>

    <!-- ============ 文件 ============ -->
    <div class="section">
      <div class="section-head"><h3>文件</h3></div>
      <div class="card flush">
        ${CAN_MANAGE ? `<div style="padding:14px 16px;border-bottom:1px solid var(--border)">
          <div class="row" style="gap:10px;align-items:center">
            <div class="picker">
              <button class="btn sm" onclick="togglePicker(event)">选择文件 / 文件夹 ▾</button>
              <div class="picker-menu" id="picker-menu" style="display:none">
                <button onclick="pickFiles()">选择文件 <span class="muted">可多选</span></button>
                <button onclick="pickDir()">选择整个文件夹 <span class="muted">保留子目录</span></button>
              </div>
            </div>
            <span class="muted" id="upload-limit" style="font-size:12px"></span>
          </div>
          <input type="file" id="file-input" multiple style="display:none">
          <input type="file" id="dir-input" webkitdirectory directory multiple style="display:none">
        </div>` : ""}
        ${CAN_MANAGE ? `<div class="files-bar">
          <label><input type="checkbox" id="files-all" onchange="toggleAllFiles(this.checked)"> 全选</label>
          <span class="spacer"></span>
          <span class="muted" id="files-selinfo" style="font-size:12px"></span>
          <button class="btn danger sm" id="files-del-sel" onclick="deleteSelectedFiles()" disabled>删除选中</button>
          <button class="btn ghost sm" id="files-clear" onclick="clearAllFiles()">清空全部</button>
        </div>` : ""}
        <div class="scroll"><table>
          <thead><tr>${CAN_MANAGE ? `<th style="width:34px"></th>` : ""}<th>名称</th><th>大小</th><th></th></tr></thead>
          <tbody id="files-body"></tbody>
        </table></div>
      </div>
      <p class="muted" style="font-size:12px">该目录是一个 Python 包：<code>__init__.py</code> 里用 <code>@tool</code> 注册工具，其余模块可以 <code>import</code>。可以直接选文件夹整包上传，子目录会按原样还原（<code>__pycache__</code>、<code>.git</code> 等会自动跳过）。</p>
    </div>

    <!-- ============ 日志 ============ -->
    <div class="section">
      <div class="section-head"><h3>工具调用日志</h3><span class="spacer"></span>
        <span class="hint">仅保留近 1 小时</span>
        <button class="btn ghost sm" onclick="loadLogs()">刷新</button></div>
      <div class="card flush">
        <div class="scroll"><table>
          <thead><tr><th>时间</th><th>工具</th><th>状态</th><th>耗时</th><th>详情</th></tr></thead>
          <tbody id="logs-body"></tbody>
        </table></div>
      </div>
      <p class="muted" style="font-size:12px">仅记录工具调用（正常调用与异常），超过 1 小时的记录自动清除，不记录其它内容。</p>
    </div>

    <!-- ============ 成员 ============ -->
    <div class="section">
      <div class="section-head"><h3>成员</h3><span class="spacer"></span>
        <button class="btn ghost sm" onclick="leaveGroup()">退出该组</button></div>
      <div class="card flush">
        <div class="scroll"><table>
          <thead><tr><th>用户名</th><th>加入时间</th><th>角色</th><th></th></tr></thead>
          <tbody id="members-body"></tbody>
        </table></div>
      </div>
      <p class="muted" style="font-size:12px;margin:10px 0 0">
        ${IS_OWNER ? "你是所有者：可移除成员。你退出时所有权会自动转给最早加入的成员。"
                   : CAN_MANAGE ? "你是系统管理员：可管理该组并移除成员。"
                   : "退出后会同时解绑你绑定到本组的 API 密钥。"}
      </p>
    </div>`,
  });
  loadInit(); loadTools(); loadFiles(); loadLogs(); loadMembers(); loadLimits(); initUploadZone();
}

async function loadInit() {
  try {
    const r = await API("/api/toolgroups/" + ID + "/init");
    document.getElementById("init-content").value = r.content || "";
  } catch (e) { toast(e.message, "err"); }
}

async function saveInit() {
  try {
    await API("/api/toolgroups/" + ID + "/init", { method: "PUT", body: JSON.stringify({
      content: document.getElementById("init-content").value }) });
    toast("已保存 __init__.py");
    return true;
  } catch (e) { toast(e.message, "err"); return false; }
}

async function reload() {
  if (!(await saveInit())) return;
  try {
    const r = await API("/api/toolgroups/" + ID + "/reload", { method: "POST" });
    const out = document.getElementById("reload-out");
    if (r.error) out.innerHTML = `<span class="badge err">加载失败</span> <pre style="margin-top:8px">${escapeHtml(r.error)}</pre>`;
    else out.innerHTML = `<span class="badge ok">加载成功</span> <span class="muted">已注册 ${r.tools.length} 个工具，提示词：${r.prompt ? "已设置" : "未设置"}</span>`;
    loadTools();
  } catch (e) { toast(e.message, "err"); }
}

async function loadTools() {
  const el = document.getElementById("tools-body");
  let tools = [];
  try { tools = await API("/api/toolgroups/" + ID + "/tools"); }
  catch (e) { el.innerHTML = `<p class="muted" style="margin:0">${escapeHtml(e.message)}</p>`; return; }
  if (!tools.length) {
    el.innerHTML = `<p class="muted" style="margin:0">暂未注册工具。编辑上方 <code>__init__.py</code> 后点击「保存并重载」。</p>`;
    return;
  }
  el.innerHTML = `<div class="scroll scroll-b"><table>
    <thead><tr><th>名称</th><th>描述</th><th>参数</th></tr></thead><tbody>
    ${tools.map(t => `<tr>
      <td><span class="tag">${escapeHtml(t.name)}</span></td>
      <td>${escapeHtml(t.description)}</td>
      <td><pre style="max-width:420px">${escapeHtml(JSON.stringify(t.parameters, null, 2))}</pre></td>
    </tr>`).join("")}
    </tbody></table></div>`;
}

async function loadFiles() {
  const tb = document.getElementById("files-body");
  let files = [];
  try { files = await API("/api/toolgroups/" + ID + "/files"); } catch (e) { return; }
  FILES = files;
  const cols = CAN_MANAGE ? 4 : 3;
  if (!files.length) { tb.innerHTML = `<tr><td colspan="${cols}" class="empty">暂无文件。</td></tr>`; resetFilesBar(); return; }
  tb.innerHTML = files.map((f, i) => `<tr>
    ${CAN_MANAGE ? `<td><input type="checkbox" class="file-check" data-i="${i}" onchange="onFileCheck()"></td>` : ""}
    <td class="mono">${escapeHtml(f.name)}</td>
    <td class="muted">${fmtBytes(f.size)}</td>
    <td class="actions">${CAN_MANAGE
      ? `<button class="btn danger sm" onclick="delFileAt(${i})">删除</button>` : ""}</td>
  </tr>`).join("");
  resetFilesBar();
}

// ---- 文件列表的批量操作 --------------------------------------------------
function checkedIndexes() {
  return Array.from(document.querySelectorAll(".file-check:checked")).map(cb => Number(cb.dataset.i));
}

function resetFilesBar() {
  const all = document.getElementById("files-all");
  if (all) { all.checked = false; all.indeterminate = false; }
  const info = document.getElementById("files-selinfo");
  if (info) info.textContent = "";
  const del = document.getElementById("files-del-sel");
  if (del) del.disabled = true;
  const clear = document.getElementById("files-clear");
  if (clear) clear.disabled = !FILES.length;
}

function onFileCheck() {
  const n = checkedIndexes().length;
  const all = document.getElementById("files-all");
  if (all) {
    all.checked = n > 0 && n === FILES.length;
    all.indeterminate = n > 0 && n < FILES.length;
  }
  const info = document.getElementById("files-selinfo");
  if (info) info.textContent = n ? `已选 ${n} 个` : "";
  const del = document.getElementById("files-del-sel");
  if (del) del.disabled = n === 0;
}

function toggleAllFiles(on) {
  document.querySelectorAll(".file-check").forEach(cb => { cb.checked = on; });
  onFileCheck();
}

async function deleteSelectedFiles() {
  const names = checkedIndexes().map(i => FILES[i] && FILES[i].name).filter(Boolean);
  if (!names.length) return;
  if (!confirm(`确定删除选中的 ${names.length} 个文件？\n\n${names.slice(0, 12).join("\n")}${names.length > 12 ? `\n… 还有 ${names.length - 12} 个` : ""}`)) return;
  try {
    const r = await API("/api/toolgroups/" + ID + "/files/delete",
      { method: "POST", body: JSON.stringify({ names }) });
    toast(`已删除 ${r.count} 个文件`);
    loadFiles();
  } catch (e) { toast(e.message, "err"); }
}

async function clearAllFiles() {
  if (!FILES.length) { toast("没有可清空的文件", "err"); return; }
  if (!confirm(`确定清空全部 ${FILES.length} 个文件？\n\n__init__.py 会保留（否则这个包无法加载）。`)) return;
  try {
    const r = await API("/api/toolgroups/" + ID + "/files/clear", { method: "POST" });
    toast(`已清空 ${r.count} 个文件`);
    loadFiles();
  } catch (e) { toast(e.message, "err"); }
}

// ---------------------------------------------------------------- 上传
// 限制从后端取，避免前后端各写一份常量后对不上
let LIMITS = { max_files: 30, max_depth: 3, max_bytes: 30 * 1024 * 1024, max_total_bytes: 100 * 1024 * 1024 };

async function loadLimits() {
  try { LIMITS = await API("/api/toolgroups/" + ID + "/files/limits"); } catch (e) { return; }
  const el = document.getElementById("upload-limit");
  if (el) el.textContent =
    `单次少于 ${LIMITS.max_files} 个文件 · 目录最深 ${LIMITS.max_depth} 层 · ` +
    `单文件 ≤ ${fmtBytes(LIMITS.max_bytes)} · 合计 ≤ ${fmtBytes(LIMITS.max_total_bytes)}`;
}

const SKIP_DIRS = ["__pycache__", ".agentgate", ".git", ".idea", "node_modules", ".venv", "venv"];
const SKIP_FILES = [".DS_Store", "Thumbs.db", "desktop.ini"];

// 把浏览器给的文件列表整理成 [{file, path, size}]
// stripTop=true 时用的是文件夹选择（webkitRelativePath = "文件夹/子目录/文件.py"），
// 要去掉最外层那层文件夹名 —— 工具组目录本身就是根。
function collectUploadFiles(fileList, stripTop) {
  const items = [];
  for (const f of fileList) {
    let rel = stripTop ? (f.webkitRelativePath || f.name) : f.name;
    rel = rel.replace(/\\/g, "/");
    const parts = rel.split("/").filter(p => p && p !== ".");
    if (stripTop) parts.shift();
    if (!parts.length) continue;
    if (parts.some(p => SKIP_DIRS.includes(p))) continue;
    const base = parts[parts.length - 1];
    if (SKIP_FILES.includes(base) || base.endsWith(".pyc")) continue;
    items.push({ file: f, path: parts.join("/"), size: f.size });
  }
  return items;
}

// 前端先挡一道，给出具体是哪个文件超了；后端还有一份权威校验
function checkUpload(items) {
  if (!items.length) return "没有可上传的文件（可能都被过滤掉了）";
  if (items.length >= LIMITS.max_files)
    return `文件数 ${items.length} 过多：一次最多 ${LIMITS.max_files - 1} 个（需少于 ${LIMITS.max_files}）`;
  let total = 0;
  for (const it of items) {
    const depth = it.path.split("/").length - 1;
    if (depth > LIMITS.max_depth)
      return `${it.path} 目录层级过深（${depth} 层）：最多 ${LIMITS.max_depth} 层`;
    if (it.size > LIMITS.max_bytes)
      return `${it.path} 太大（${fmtBytes(it.size)}）：单文件最多 ${fmtBytes(LIMITS.max_bytes)}`;
    total += it.size;
  }
  if (total > LIMITS.max_total_bytes)
    return `合计 ${fmtBytes(total)} 超限：单次最多 ${fmtBytes(LIMITS.max_total_bytes)}`;
  return null;
}

// 上传入口：一个按钮 + 下拉。
// 浏览器限制：原生选择器没法同时接受「文件」和「文件夹」—— webkitdirectory 一加上
// 就只能是文件夹。所以做成一个按钮点开两个选项，至少入口是统一的。
function togglePicker(e) {
  if (e) { e.stopPropagation(); }
  const m = document.getElementById("picker-menu");
  if (!m) return;
  m.style.display = (m.style.display === "none" || !m.style.display) ? "flex" : "none";
}

function closePicker() {
  const m = document.getElementById("picker-menu");
  if (m) m.style.display = "none";
}

function pickFiles() {
  closePicker();
  const el = document.getElementById("file-input");
  if (el) el.click();
}

function pickDir() {
  closePicker();
  const el = document.getElementById("dir-input");
  if (el) el.click();
}

function initUploadZone() {
  const input = document.getElementById("file-input");
  const dirInput = document.getElementById("dir-input");
  if (!input) return;
  input.addEventListener("change", () => { if (input.files.length) uploadPicked("files"); });
  if (dirInput) dirInput.addEventListener("change", () => { if (dirInput.files.length) uploadPicked("dir"); });
  // 点别处收起菜单
  document.addEventListener("click", () => closePicker());
}

async function uploadPicked(which) {
  const input = document.getElementById(which === "dir" ? "dir-input" : "file-input");
  const items = collectUploadFiles(input.files, which === "dir");
  if (!items.length) { toast("没有可上传的文件（可能都被过滤掉了）", "err"); return; }
  const err = checkUpload(items);
  if (err) { toast(err, "err"); return; }

  const fd = new FormData();
  for (const it of items) fd.append("file", it.file, it.path);

  try {
    const r = await fetch("/api/toolgroups/" + ID + "/files", {
      method: "POST",
      headers: { Authorization: "Bearer " + localStorage.getItem("ag_token") },
      body: fd,
    });
    if (!r.ok) {
      let d = "HTTP " + r.status;
      try { d = (await r.json()).detail || d; } catch (e2) {}
      throw new Error(d);
    }
    const j = await r.json();
    input.value = "";
    toast(`已上传 ${j.count} 个文件`);
    loadFiles();
  } catch (e) { toast(e.message, "err"); }
}

async function delFileAt(i) {
  const f = FILES[i];
  if (!f) return;
  if (!confirm("确定删除文件 " + f.name + "？")) return;
  // 路径里的 / 要保留成分隔符，只编码每一段
  const enc = f.name.split("/").map(encodeURIComponent).join("/");
  try {
    await API("/api/toolgroups/" + ID + "/files/" + enc, { method: "DELETE" });
    toast("已删除");
    loadFiles();
  } catch (e) { toast(e.message, "err"); }
}

async function loadLogs() {
  const tb = document.getElementById("logs-body");
  let logs = [];
  try { logs = await API("/api/toolgroups/" + ID + "/logs"); } catch (e) { return; }
  if (!logs.length) { tb.innerHTML = `<tr><td colspan="5" class="empty">近 1 小时内没有工具调用。</td></tr>`; return; }
  tb.innerHTML = logs.map(l => `<tr>
    <td class="muted">${fmtTime(l.created_at)}</td>
    <td><span class="tag">${escapeHtml(l.tool_name)}</span></td>
    <td>${l.status === "normal" ? '<span class="badge ok">正常</span>' : '<span class="badge err">异常</span>'}</td>
    <td class="muted">${l.duration_ms} ms</td>
    <td class="muted" style="max-width:380px">${escapeHtml(l.detail)}</td>
  </tr>`).join("");
}

async function loadMembers() {
  const tb = document.getElementById("members-body");
  let members = [];
  try { members = await API("/api/toolgroups/" + ID + "/members"); } catch (e) { return; }
  if (!members.length) { tb.innerHTML = `<tr><td colspan="4" class="empty">暂无成员。</td></tr>`; return; }
  tb.innerHTML = members.map(m => {
    const role = m.is_owner ? '<span class="badge ok">所有者</span>'
               : m.user_id === ME.username ? '<span class="badge muted">我</span>'
               : '<span class="badge muted">成员</span>';
    const canRemove = CAN_MANAGE && !m.is_owner && m.user_id !== ME.username;
    const action = canRemove
      ? `<button class="btn danger sm" onclick="removeMember('${encodeURIComponent(m.user_id)}')">移除</button>`
      : '';
    return `<tr>
      <td class="mono">${escapeHtml(m.user_id)}</td>
      <td class="muted">${fmtTime(m.joined_at)}</td>
      <td>${role}</td>
      <td class="actions">${action}</td>
    </tr>`;
  }).join("");
}

async function removeMember(encodedName) {
  const name = decodeURIComponent(encodedName);
  if (!confirm(`把「${name}」移出该工具组？\n他的密钥会从本组解绑（密钥本身仍然可用）。`)) return;
  try {
    await API(`/api/toolgroups/${encodeURIComponent(ID)}/members/${encodedName}`,
              { method: "DELETE" });
    toast(`已移除「${name}」`);
    await loadMembers();
  } catch (e) { toast(e.message, "err"); }
}

async function leaveGroup() {
  const msg = IS_OWNER
    ? `你是该组的所有者。\n\n退出后所有权会【自动转给最早加入的成员】；若没有其他成员，该组会被删除。\n你绑定到本组的 API 密钥会同时解绑。\n\n确定退出？`
    : `退出该组？\n你绑定到本组的 API 密钥会同时解绑（密钥本身仍可用）。`;
  if (!confirm(msg)) return;
  try {
    const r = await API(`/api/toolgroups/${encodeURIComponent(ID)}/leave`, { method: "POST" });
    if (r && r.transferred_to) toast(`已退出，所有权已转给「${r.transferred_to}」`);
    else if (r && r.deleted) toast("已退出，该组已删除");
    else toast("已退出该组");
    location.href = "/dashboard";
  } catch (e) { toast(e.message, "err"); }
}

init();
</script>
</body>
</html>
